[package]
name = "subrosa"
version = "0.23.0"
edition = "2021"
rust-version = "1.85"
description = "Persistent, private memory for Claude Code. Archives every session into a local SQLite FTS5 database and makes it searchable."
repository = "https://github.com/ij5a/subrosa"
license = "MIT"
keywords = ["claude", "claude-code", "memory", "sqlite", "fts5"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
# Pinned to 0.9: candle 0.10+ hard-depends on `tokenizers`, which pulls in
# onig_sys (bundled C oniguruma). Check that before bumping — a guard test in
# src/embed.rs fails if either name reappears in Cargo.lock.
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
chacha20poly1305 = "0.10.1"
clap = { version = "4.6", features = ["derive"] }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = "1"
serde_json = "1"
sha2 = "0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true
# Hooks guarantee exit 0 via Result handling (no catch_unwind), and run.sh
# absorbs abnormal exits — abort drops the unwinder: smaller, faster binary.
panic = "abort"
